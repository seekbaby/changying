# ============================================================
# 长盈 v3 — Docker Compose + Watchtower 自动更新
# 飞牛NAS通用：一次部署，后续全自动
# 镜像源：ghcr.io（GitHub Container Registry，公开免密拉取）
# ============================================================

services:
  changying:
    image: ghcr.io/seekbaby/changying:latest
    container_name: changying
    pull_policy: always
    ports:
      - "3000:3000"
    volumes:
      - changying_data:/app/data
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PORT=3000
      - DB_DIR=/app/data

  # Watchtower 每60秒检查 ghcr.io 镜像更新，自动重建
  watchtower:
    image: containrrr/watchtower:latest
    container_name: changying-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 60 --cleanup changying
    restart: unless-stopped

volumes:
  changying_data:
    name: changying_data
