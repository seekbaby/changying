# ============================================================
# 长盈 1.0 — Docker Compose 一键部署
# 用法: docker compose up -d
# ============================================================

services:
  changying:
    image: changying:2.5
    container_name: changying
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/arm64
        - linux/amd64
    ports:
      - "3000:3000"
    volumes:
      - changying_data:/app/data
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
      - PORT=3000
      - DB_DIR=/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  changying_data:
    name: changying_data
